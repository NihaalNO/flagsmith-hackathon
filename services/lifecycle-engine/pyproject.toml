[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flagpilot-lifecycle-engine"
version = "0.1.0"
description = "FlagPilot feature flag lifecycle intelligence engine (discovery, analysis, lifecycle, stale detection, cleanup planning, verification)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
]

[project.optional-dependencies]
api = ["fastapi>=0.110"]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
flagpilot-engine = "lifecycle_engine.cli:main"

[tool.setuptools.packages.find]
include = ["lifecycle_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "node: requires a Node.js >= 22.6 runtime on PATH (sample repo tests)",
    "claude_live: calls the real Claude Code CLI; opt in with FLAGPILOT_LIVE_CLAUDE=1 (costs money)",
    "groq_live: calls the real Groq API; opt in with FLAGPILOT_LIVE_GROQ=1 and GROQ_API_KEY",
]
